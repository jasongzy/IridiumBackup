name: Android

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: iridium-backup
  APP_DISPLAY_NAME: Iridium Backup

jobs:
  debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v6
      - name: Initialize native source
        working-directory: .
        run: git submodule update --init --depth 1 source/native/src/main/jni/external/tar/tar
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Test, lint, and build
        run: >-
          ./gradlew --no-daemon
          :app:testUniversalFossDebugUnitTest
          :app:lintUniversalFossDebug
          :app:assembleUniversalFossDebug
      - uses: actions/upload-artifact@v7
        with:
          path: source/app/build/outputs/apk/universalFoss/debug/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: source
    env:
      STORE_FILE: ${{ github.workspace }}/release.jks
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Initialize native source
        working-directory: .
        run: git submodule update --init --depth 1 source/native/src/main/jni/external/tar/tar
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^versionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          test -n "$version_name"
          test "$GITHUB_REF_NAME" = "$version_name"
          test -n "$SIGNING_KEY"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$STORE_FILE"
      - name: Build signed release
        run: >-
          ./gradlew --no-daemon
          :app:lintUniversalFossRelease
          :app:assembleUniversalFossRelease
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/universalFoss/release -maxdepth 1 -name '*.apk' -print -quit)"
          output="${APP_NAME}-${GITHUB_REF_NAME}.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apk"
          test -n "$apksigner"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -Z1 "$apk" | grep -Fx "assets/$abi/bin.zip" > /dev/null
          done
          "$apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "../$output"
          (cd .. && sha256sum "$output" > "${output}.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}
          path: |
            ${{ env.APP_NAME }}-${{ github.ref_name }}.apk
            ${{ env.APP_NAME }}-${{ github.ref_name }}.apk.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        working-directory: .
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${APP_NAME}-${GITHUB_REF_NAME}.apk"
          "${APP_NAME}-${GITHUB_REF_NAME}.apk.sha256"
          --verify-tag
          --generate-notes
          --title "${APP_DISPLAY_NAME} ${GITHUB_REF_NAME}"
